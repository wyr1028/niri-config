# power-tune 配置 —— 修改后运行: sudo /usr/local/sbin/power-tune
# 可选 PPD 配置: performance / balanced / power-saver

# 插电时的电源配置（游戏/重载建议 performance；想要更凉快安静可改 balanced）
PROFILE_ON_AC="performance"

# 使用电池时的电源配置
PROFILE_ON_BAT="power-saver"

# 是否应用额外 sysfs 省电调优（WiFi/ASPM/nmi_watchdog/swappiness 等）
ENABLE_SYSFS_TUNING="yes"

# 电池时 PCIe ASPM 策略: powersave(较省电) / powersupersave(最激进) / default(保守)
ASPM_ON_BAT="powersave"

# 内存交换倾向
SWAPPINESS_ON_AC="60"
SWAPPINESS_ON_BAT="100"

# 电池时是否启用 USB 自动挂起（可能造成鼠标/键盘轻微延迟，默认 no）
USB_AUTOSUSPEND="no"
