# 禁止 WirePlumber 在空闲时挂起 ALSA 声卡
# 原因：默认空闲 5 秒后会把声卡 Suspend，Chromium 系应用（微信等）
#      有时无法可靠地唤醒设备，导致声音“莫名其妙消失”。
# 删除本文件并重启 wireplumber 即可恢复默认行为。
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
