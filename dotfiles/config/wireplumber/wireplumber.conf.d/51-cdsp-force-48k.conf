# 把 KTMicro CDSP (USB Type-C 耳機線) 這一路鎖在 48kHz / 24bit。
#
# 為什麼是 48k 而不是 96k：
#   這顆 KTMicro 晶片走 full-speed USB (12Mbps)，96k/24bit 的等時傳輸
#   頻寬太緊，排程一落後就 underrun，聽起來就是電流聲 / 破音 / 跑音。
#   48kHz 是這類 USB DAC 最穩、也是絕大多數內容的原生取樣率。
#
# api.alsa.multi-rate = false：不論來源是 44.1k / 48k / 影片 / 瀏覽器，
#   這張卡都固定跑 48k，避免裝置一直重新協商造成爆音。
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-KTMicro.*"
      }
    ]
    actions = {
      update-props = {
        audio.allowed-rates = [ 48000 ]
        api.alsa.multi-rate = false
      }
    }
  }
]
